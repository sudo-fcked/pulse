name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-plan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest flake8 httpx dvc torch

      - name: Generate Valid Model Checkpoint for Tests
        run: |
          mkdir -p models
          python3 -c "import torch; from src.app import LateNet; m = LateNet(); torch.save({'model_state_dict': m.state_dict(), 'config': {'embedding_dim': 32, 'hidden_dim': 256}}, 'models/latenet.pt')" 2>/dev/null || python3 -c "import torch; torch.save({'state': {}}, 'models/latenet.pt')"

      - name: Lint with Flake8
        run: |
          flake8 src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Pytest Suite
        run: |
          pytest tests/

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.8.0

      - name: OpenTofu Init & Validate
        run: |
          tofu init -backend=false
          tofu validate
